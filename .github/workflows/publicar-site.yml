name: Publicar site bibliografico no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - '.nojekyll'
      - 'levantamento-bibliografico/**'
      - 'tabelas/comparativo/**'
      - 'tabelas/visualizacao-15-estudos/**'
      - '.github/workflows/publicar-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos do repositorio
        uses: actions/checkout@v4

      - name: Preparar as paginas publicas
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s levantamento-bibliografico/index.html
          test -s tabelas/comparativo/index.html
          test -s tabelas/visualizacao-15-estudos/index.html
          mkdir -p public/levantamento-bibliografico public/tabelas/comparativo public/tabelas/visualizacao-15-estudos
          cp index.html styles.css public/
          cp levantamento-bibliografico/index.html public/levantamento-bibliografico/
          cp tabelas/comparativo/index.html public/tabelas/comparativo/
          cp tabelas/visualizacao-15-estudos/index.html public/tabelas/visualizacao-15-estudos/
          touch public/.nojekyll
          echo "As 4 paginas e o CSS estao presentes no artefato."

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar o site completo
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
